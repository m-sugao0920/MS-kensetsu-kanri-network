<!doctype html><html lang="ja"><head>
<script src="ms_password.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バックアップ・復元｜MS建設管理システム</title><style>:root{--b:#174d78;--l:#cbdbe6;--bg:#f3f7fa;--t:#263f50}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--t)}header{background:#fff;border-bottom:1px solid var(--l)}.top{max-width:900px;margin:auto;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;color:var(--b)}button{border:0;border-radius:7px;background:var(--b);color:#fff;padding:9px 15px;font-weight:800;cursor:pointer}.sub{background:#71818c}main{max-width:900px;margin:auto;padding:24px 22px}h1{margin:0 0 6px;color:var(--b);font-size:27px}.lead{color:#6f818e;font-size:13px;margin-bottom:18px}.box{background:#fff;border:1px solid var(--l);border-radius:11px;padding:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.file{display:none}.note{background:#fff8e9;border:1px solid #ead8a8;border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.7}.mono{font-family:Consolas,monospace}</style></head><body><header><div class="top"><div class="brand">MS建設管理システム ／ バックアップ・復元</div><button onclick="location.href='kanri_settei.html'">管理・設定へ戻る</button></div></header><main><h1>バックアップ・復元</h1><div class="lead">データの保全と復元だけを行う専用画面です。</div><div class="box"><p>現在の共通データをJSON形式で書き出し、必要なときに復元できます。</p><div class="note"><b>安全のため：</b>復元すると現在のデータがバックアップ内容で置き換わります。復元前に現在のバックアップを書き出すことをおすすめします。</div><div class="actions"><button onclick="MSData.downloadBackup()">バックアップを書き出す</button><button class="sub" onclick="document.getElementById('restore').click()">バックアップを復元</button><input class="file" id="restore" type="file" accept=".json,application/json"></div><p>データ形式：<span class="mono" id="schema"></span> ／ データバージョン：<b id="dv"></b></p></div></main><script src="shared_storage.js"></script><script src="ms_data.js"></script><script>schema.textContent=MSData.APP_SCHEMA;dv.textContent=MSData.DATA_VERSION;restore.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!confirm('現在のデータをバックアップ内容で置き換えます。よろしいですか？')){e.target.value='';return}try{await MSData.restoreFile(f);alert('復元しました。メイン画面で内容を確認してください。')}catch(err){alert('復元できませんでした。\n'+err.message)}e.target.value=''});</script></body></html>
