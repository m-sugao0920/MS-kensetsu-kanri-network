<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共有データサーバー設定｜MS建設管理システム</title>
<style>
:root{--blue:#174d78;--line:#cbdbe6;--bg:#f3f7fa;--text:#263f50}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line)}.top{max-width:900px;margin:auto;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:21px;font-weight:800;color:var(--blue)}button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 17px;font-weight:700;cursor:pointer}
main{max-width:820px;margin:28px auto;padding:0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
h1{margin:0 0 8px;color:var(--blue);font-size:25px}.lead,.note{color:#607583;line-height:1.7;font-size:13px}
label{display:block;margin:22px 0 7px;font-weight:700}input{width:100%;font-size:18px;padding:12px;border:1px solid #aebbc4;border-radius:7px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.sub{background:#687d89}.status{margin-top:18px;padding:14px;border-radius:8px;background:#eef3f6;font-weight:700}
.ok{background:#e8f5ec;color:#27633d}.ng{background:#fff0ed;color:#9a3d31}.info{margin-top:18px;padding:14px;background:#f7fafc;border:1px solid #dce6ec;border-radius:8px;font-size:13px;line-height:1.8}
</style>
<script src="shared_storage.js"></script></head>
<body><header><div class="top"><div class="brand">MS建設管理システム ／ 管理者設定</div><button onclick="location.href='kanri_settei.html'">管理・設定へ戻る</button></div></header>
<main><div class="card">
<h1>共有データサーバー設定</h1>
<p class="lead">導入時またはサーバー移設時に管理者が設定します。通常の社員は変更する必要はありません。設定はこのPC・このブラウザに保存されます。</p>
<label for="api">共有データサーバー アドレス</label>
<input id="api" autocomplete="off" spellcheck="false" placeholder="例：http://192.168.1.5:8766">
<div class="row"><button id="save">保存して接続テスト</button><button id="test" class="sub">接続テストのみ</button></div>
<div id="status" class="status">未確認</div>
<div class="info">
<b>現在の試験環境</b><br>
親PC：<span id="def"></span><br><br>
<b>将来、専用サーバーへ移行する場合</b><br>
新しいサーバーへデータサーバーと shared_data を移し、この画面のアドレスを変更します。GitHub上のHTMLを会社ごとに作り直す必要はありません。
</div>
</div></main>
<script>
const api=document.getElementById('api'), st=document.getElementById('status');
document.getElementById('def').textContent=MSShared.currentTestDefault;
api.value=MSShared.apiBase();

function show(ok,msg){st.className='status '+(ok?'ok':'ng');st.textContent=msg}
function test(){
  try{
    const r=MSShared.ping();
    show(true,'接続成功：'+MSShared.apiBase());
    return true;
  }catch(e){
    show(false,'接続できません：'+e.message);
    return false;
  }
}
document.getElementById('save').onclick=()=>{
  try{
    MSShared.setApiBase(api.value);
    test();
  }catch(e){show(false,e.message)}
};
document.getElementById('test').onclick=()=>{
  try{
    const old=MSShared.apiBase();
    if(api.value.trim()!==old) MSShared.setApiBase(api.value);
    test();
  }catch(e){show(false,e.message)}
};
test();
</script></body></html>
