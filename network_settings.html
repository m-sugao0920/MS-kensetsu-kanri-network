<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共有データ接続設定</title>
<style>body{font-family:Meiryo,sans-serif;background:#eef6fc;color:#234;margin:0}main{max-width:680px;margin:50px auto;background:white;padding:28px;border-radius:12px}input{box-sizing:border-box;width:100%;padding:12px;font-size:18px}button,a{display:inline-block;padding:12px;margin-top:16px;background:#176fa8;color:white;border:0;border-radius:6px;text-decoration:none;font-size:16px}#status{white-space:pre-wrap;line-height:1.7;margin-top:20px}.note{line-height:1.8}</style>
<script src="shared_storage.js?v=20261003"></script><main><h1>共有データ接続設定</h1><p class="note">親PCで start_server.bat を起動してから、下のボタンを押してください。Chromeからローカルネットワークへのアクセス許可を求められたら「許可」を選びます。</p><label for="api">親PCの接続先</label><input id="api"><button id="test">保存して接続テスト</button> <a href="index.html" id="open" hidden style="display:none">建設管理システムを開く</a><div id="status">未確認</div><p class="note">この設定は各パソコンのブラウザーで一度ずつ行います。親PCのIPアドレスが変わった場合は、起動画面に表示される新しいアドレスを入力してください。</p></main>
<script>
const api=document.getElementById('api'),st=document.getElementById('status'),button=document.getElementById('test'),link=document.getElementById('open');api.value=MSShared.apiBase();
button.onclick=async()=>{button.disabled=true;link.style.display='none';st.textContent='接続を確認しています。アクセス許可の表示が出たら「許可」を選んでください。';try{
api.value=MSShared.setApiBase(api.value);
const r=await fetch(MSShared.apiUrl('/api/ping'),{cache:'no-store',signal:AbortSignal.timeout(60000)});
if(!r.ok)throw Error('サーバーからエラーが返りました：'+r.status);
const j=await r.json();if(!j.ok)throw Error('対応するデータサーバーではありません。');
const dataResponse=await fetch(MSShared.apiUrl('/api/storage/all'),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!dataResponse.ok)throw Error('データを読み込めません。');const store=await dataResponse.json();if(!store.data||!store.versions)throw Error('親PCの server.py を更新してください。');
const projects=JSON.parse(store.data['mscm:v1:projects']||'[]');st.textContent='接続成功：'+MSShared.apiBase()+'\n工事データ：'+projects.length+'件\n保存先：'+j.dataFile;st.style.color='#26733d';link.hidden=false;link.style.display='inline-block';
}catch(e){st.style.color='#a33';st.textContent='接続できません：'+e.message+'\n親PCのサーバー起動、接続先、Chromeのサイト設定にあるローカルネットワークのアクセス許可を確認してください。';}finally{button.disabled=false;}};
</script></html>
