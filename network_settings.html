<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共有データ接続設定｜MS建設管理</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f9;color:#263b47;margin:0}main{max-width:760px;margin:50px auto;background:white;border:1px solid #d9e1e6;border-radius:12px;padding:28px}h1{font-size:22px;margin-top:0}label{display:block;font-weight:700;margin:22px 0 7px}input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:1px solid #aebbc4;border-radius:7px}button{font-size:15px;padding:10px 18px;margin:14px 8px 0 0;border:0;border-radius:7px;background:#176fa8;color:white;font-weight:700}.sub{background:#687d89}.status{margin-top:20px;padding:13px;border-radius:7px;background:#eef3f6}.ok{background:#e8f5ec;color:#27633d}.ng{background:#fff0ed;color:#9a3d31}.note{font-size:13px;color:#60737f;line-height:1.7}</style><script src="shared_storage.js"></script></head><body><main><h1>共有データ接続設定</h1><p class="note">通常は変更不要です。親PCのIPアドレスが変わった場合だけ変更します。親PCでは先にデータサーバーを起動してください。</p><label>親PC データサーバー</label><input id="api" value=""><div><button id="save">保存して接続テスト</button><button class="sub" id="reset">初期値に戻す</button><button class="sub" onclick="location.href='index.html'">メイン画面へ</button></div><div id="status" class="status">未確認</div></main><script>
const api=document.getElementById('api'),st=document.getElementById('status');api.value=MSShared.apiBase();
function test(){try{const r=MSShared.ping();st.className='status ok';st.textContent='接続OK：'+MSShared.apiBase();return true}catch(e){st.className='status ng';st.textContent='接続できません：'+e.message;return false}}
document.getElementById('save').onclick=()=>{try{MSShared.setApiBase(api.value);test()}catch(e){st.className='status ng';st.textContent=e.message}};
document.getElementById('reset').onclick=()=>{api.value=MSShared.resetApiBase();test()};test();
</script></body></html>
