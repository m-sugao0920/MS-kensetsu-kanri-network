<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共有データサーバー設定｜MS建設管理システム</title>
<style>
:root{--blue:#174d78;--line:#cbdbe6;--bg:#f3f7fa;--text:#263f50}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line)}.top{max-width:1000px;margin:auto;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:900;color:var(--blue)}button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 17px;font-weight:800;cursor:pointer}
main{max-width:820px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
h1{margin:0 0 8px;color:var(--blue)}p{color:#607583;line-height:1.7;font-size:13px}
label{display:block;margin:20px 0 7px;font-weight:800}input{width:100%;padding:12px;font-size:18px;border:1px solid #aebbc4;border-radius:7px}
.row{display:flex;gap:10px;margin-top:14px}.sub{background:#667b87}.status{margin-top:16px;padding:13px;border-radius:8px;background:#eef3f6;font-weight:800}
.ok{background:#e8f5ec;color:#27633d}.ng{background:#fff0ed;color:#9a3d31}.note{margin-top:18px;padding:13px;border:1px solid #dce6ec;border-radius:8px;background:#f7fafc;font-size:12px;line-height:1.8}
</style>
<script src="shared_storage.js"></script></head><body>
<header><div class="top"><div class="brand">MS建設管理システム ／ 管理者設定</div><button onclick="location.href='kanri_settei.html'">管理・設定へ戻る</button></div></header>
<main><div class="card"><h1>共有データサーバー設定</h1>
<p>導入時またはサーバー移設時に管理者が設定します。通常の社員は変更しません。</p>
<label>共有データサーバー アドレス</label>
<input id="api" placeholder="例：http://192.168.1.5:8766">
<div class="row"><button id="save">保存して接続テスト</button><button id="test" class="sub">接続テストのみ</button></div>
<div id="status" class="status">未確認</div>
<div class="note">現在の試験環境は http://192.168.1.5:8766 です。将来専用サーバーへ移行した場合は、ここで接続先だけを変更する設計です。</div>
</div></main>
<script>
const input=document.getElementById('api'),statusEl=document.getElementById('status');
const current=MSShared.apiBase ? MSShared.apiBase() : 'http://192.168.1.5:8766';
input.value=current;
function show(ok,msg){statusEl.className='status '+(ok?'ok':'ng');statusEl.textContent=msg}
async function probe(base){
  base=String(base||'').trim().replace(/\/+$/,'');
  try{
    const r=await fetch(base+'/api/storage/all',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    await r.json(); show(true,'接続成功：'+base); return true;
  }catch(e){show(false,'接続できません：'+base); return false}
}
document.getElementById('test').onclick=()=>probe(input.value); // test only; does not save
document.getElementById('save').onclick=async()=>{
  const base=String(input.value||'').trim().replace(/\/+$/,'');
  if(!/^https?:\/\//i.test(base)){show(false,'http:// または https:// から入力してください。');return}
  if(await probe(base)){
    try{ MSShared.setApiBase(base); show(true,'保存・接続成功：'+base); }
    catch(e){show(false,'保存できません：'+e.message)}
  }
};
</script></body></html>
