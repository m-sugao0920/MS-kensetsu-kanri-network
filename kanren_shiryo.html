<!doctype html><html lang="ja"><head>
<script src="ms_password.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>関連資料｜MS建設管理システム</title>
<style>
:root{--blue:#176fa8;--deep:#173f6b;--line:#c9dbe8;--text:#243746;--bg:#f3f8fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#edf6fc);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;min-height:100vh}.top{background:linear-gradient(135deg,#173f6b,#245b86);color:#fff}.top-inner{max-width:1200px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:950}.sub{font-size:12px;opacity:.9}.top button{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 14px;font-weight:900;cursor:pointer}main{max-width:1200px;margin:auto;padding:18px 24px}.head,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 16px rgba(23,63,107,.07)}.head{padding:14px 16px;margin-bottom:12px}.no{font-size:12px;color:#60798a;font-weight:900}.name{font-size:24px;color:var(--deep);font-weight:950;margin-top:3px}.panel{overflow:hidden;margin-bottom:12px}.panel-head{padding:11px 14px;background:#f2f8fc;border-bottom:1px solid #d9e6ef;font-size:17px;font-weight:950;color:var(--deep)}.form{padding:15px;display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center}.form label{font-weight:900;color:#526b7a}.form input,.form select{width:100%;height:40px;border:1px solid #abc3d3;border-radius:7px;padding:0 10px;font-size:14px;background:#fff}.filebox{display:flex;gap:8px;align-items:center}.filebox input{padding:7px}.buttons{grid-column:2;display:flex;gap:8px}.primary{border:0;background:#176fa8;color:#fff;border-radius:8px;padding:11px 22px;font-weight:950;cursor:pointer}.primary:disabled{opacity:.5}.hint{grid-column:2;color:#6a7d89;font-size:12px}.list{padding:0 14px 14px}.row{display:grid;grid-template-columns:120px minmax(0,1fr) 110px 90px 150px;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #e7eef3}.row.headrow{font-size:12px;font-weight:900;color:#60798a}.title{font-weight:850;overflow:hidden;text-overflow:ellipsis}.filename{font-size:11px;color:#758691;margin-top:3px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf3f9;color:#315d78;font-size:11px;font-weight:900}.row button{border:1px solid #9eb9ca;background:#fff;color:#315d78;border-radius:6px;padding:7px 9px;font-weight:900;cursor:pointer}.row .del{color:#9a3f3f;border-color:#d5aaaa}.empty{padding:30px;text-align:center;color:#778a96}.status{padding:10px 15px;font-size:13px;display:none}.status.ok{display:block;background:#edf8f1;color:#2f6e49}.status.err{display:block;background:#fff1f1;color:#963c3c}@media(max-width:760px){.form{grid-template-columns:1fr}.buttons,.hint{grid-column:1}.row{grid-template-columns:90px 1fr 80px}.row>*:nth-child(3),.row>*:nth-child(4){display:none}}
</style><script src="shared_storage.js?v=20261003"></script></head><body><header class="top"><div class="top-inner"><div><div class="brand">MS建設管理システム</div><div class="sub">工事カルテ ＞ 関連資料</div></div><button id="back">工事カルテへ</button></div></header><main><section class="head"><div class="no" id="projectNo"></div><div class="name" id="projectName">関連資料</div></section><section class="panel"><div class="panel-head">PDFを登録</div><div id="status" class="status"></div><div class="form"><label>資料区分</label><select id="category"><option>図面</option><option>見積書</option><option>契約書</option><option>発注・請書</option><option>施工資料</option><option>請求資料</option><option>写真資料</option><option selected>その他</option></select><label>資料名</label><input id="title" placeholder="未入力ならPDFのファイル名を使用"><label>PDFファイル</label><div class="filebox"><input id="file" type="file" accept="application/pdf,.pdf"></div><div class="buttons"><button class="primary" id="upload">PDFを登録</button></div><div class="hint">PDFを選択して登録するだけで、この工事の共有資料として保存されます。PDF本体は storage.json とは別に保存します。</div></div></section><section class="panel"><div class="panel-head">登録済み資料</div><div class="list"><div class="row headrow"><div>区分</div><div>資料名</div><div>容量</div><div>登録日</div><div>操作</div></div><div id="rows"></div></div></section></main><script src="ms_data.js"></script><script>
(function(){const p=new URLSearchParams(location.search),id=p.get('id')||sessionStorage.getItem('mscm:selectedProjectId')||'',project=id&&window.MSData?MSData.get('projects',id):null;if(!project){location.replace('kouji_list.html');return}sessionStorage.setItem('mscm:selectedProjectId',id);document.getElementById('projectNo').textContent='工事番号　'+(project.legacyProjectNo||project.no||'—');document.getElementById('projectName').textContent=project.name||'関連資料';document.getElementById('back').onclick=()=>location.href='kouji_carte.html?id='+encodeURIComponent(id);const status=document.getElementById('status');function msg(t,ok=true){status.textContent=t;status.className='status '+(ok?'ok':'err')}function size(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch(MSShared.apiUrl('/api/documents/list?projectId=')+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'読込エラー');const box=document.getElementById('rows'),rows=j.documents||[];box.innerHTML=rows.length?rows.map(x=>`<div class="row"><div><span class="badge">${esc(x.category)}</span></div><div><div class="title">${esc(x.title)}</div><div class="filename">${esc(x.fileName)}</div></div><div>${size(Number(x.size)||0)}</div><div>${esc((x.registeredAt||'').slice(0,10).replaceAll('-','/'))}</div><div><button onclick="window.open('${esc(MSShared.apiUrl(x.url))}','_blank')">開く</button> <button class="del" data-del="${esc(x.id)}">削除</button></div></div>`).join(''):'<div class="empty">まだPDFは登録されていません。</div>';box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('このPDFを削除しますか？\n元に戻せません。'))return;const rr=await fetch(MSShared.apiUrl('/api/documents/delete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.del})});const jj=await rr.json();if(!rr.ok){msg(jj.error||'削除できませんでした',false);return}msg('PDFを削除しました。');load()})}catch(e){msg('関連資料を読み込めません。新しい server.py で起動しているか確認してください。',false)}}document.getElementById('upload').onclick=async function(){const f=document.getElementById('file').files[0];if(!f){msg('登録するPDFを選択してください。',false);return}if(!f.name.toLowerCase().endsWith('.pdf')){msg('PDFファイルを選択してください。',false);return}this.disabled=true;msg('PDFを登録しています…');try{const h={'Content-Type':'application/pdf','X-Project-Id':id,'X-File-Name':encodeURIComponent(f.name),'X-Category':encodeURIComponent(document.getElementById('category').value),'X-Title':encodeURIComponent(document.getElementById('title').value.trim())};const r=await fetch(MSShared.apiUrl('/api/documents/upload'),{method:'POST',headers:h,body:f}),j=await r.json();if(!r.ok)throw Error(j.error||'登録エラー');document.getElementById('file').value='';document.getElementById('title').value='';msg('PDFを登録しました。');await load()}catch(e){msg('PDFを登録できませんでした：'+e.message,false)}finally{this.disabled=false}};load()})();
</script></body></html>
