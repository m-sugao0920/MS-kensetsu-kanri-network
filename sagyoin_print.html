<!doctype html><html lang="ja"><head>
<script src="ms_password.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作業員名簿｜A3横</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:"Yu Gothic","Meiryo",sans-serif;color:#000;background:#e9eef0}button{font:inherit}.toolbar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;padding:9px 14px;background:#284b5b;color:#fff}.toolbar b{margin-right:auto}.toolbar button{border:0;border-radius:5px;padding:7px 13px;font-weight:800}.back{background:#708087;color:#fff}.print{background:#fff;color:#284b5b}.sheet{width:420mm;height:297mm;margin:8px auto;background:#fff;padding:8mm 7mm 7mm;overflow:hidden;box-shadow:0 2px 10px #999;page-break-after:always}.sheet:last-child{page-break-after:auto}
.title{text-align:center;font-size:18pt;font-weight:700;letter-spacing:8mm;margin:0 0 2mm;padding-left:8mm}.dateLine{text-align:center;font-size:7pt;margin-bottom:3mm}.headArea{height:24mm;display:grid;grid-template-columns:1.55fr .65fr .65fr;gap:7mm;align-items:end;margin-bottom:2mm;font-size:8pt}.headLeft .line{display:flex;align-items:flex-end;margin:2mm 0}.headLeft b{width:30mm;letter-spacing:1mm}.fill{border-bottom:.3mm solid #111;min-height:5mm;flex:1;padding:0 2mm}.companyBox{text-align:center}.companyBox .ji{font-size:7pt;margin-bottom:1mm}.companyBox .company{display:flex;align-items:flex-end;gap:1mm}.companyBox .company span:first-child{white-space:nowrap}.companyBox .company .fill{min-width:30mm}.confirm{border:.3mm solid #111;height:9mm;display:grid;grid-template-columns:13mm 1fr;align-items:center;text-align:center;font-size:7pt}.confirm div:first-child{border-right:.3mm solid #111;height:100%;display:flex;align-items:center;justify-content:center;line-height:1.1}.confirmWrap{align-self:start}.pageNo{text-align:right;font-size:7pt;margin-top:1mm}
.roster{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.3pt;line-height:1.12}.roster th,.roster td{border:.22mm solid #111;padding:.45mm .5mm;vertical-align:middle;overflow-wrap:anywhere}.roster thead th{height:12mm;text-align:center;font-weight:700;padding:.3mm}.roster .subline{border-top:.18mm dotted #555}.roster .personStart td{border-top-width:.42mm}.roster .num{text-align:center}.roster .center{text-align:center}.roster .name{text-align:center;font-size:7.3pt;font-weight:700}.roster .kana{display:block;font-size:5.5pt;font-weight:400;margin-bottom:.6mm}.roster .small{font-size:5.3pt}.roster .tiny{font-size:4.8pt}.roster .label{font-size:4.8pt;display:block;color:#222}.roster .date{text-align:center;white-space:nowrap}.roster tbody tr{height:5.35mm}.roster .blankrow td{height:16.05mm}.roster .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.5mm}.roster .blood{font-weight:700;text-align:center}.foot{font-size:6pt;text-align:right;margin-top:1mm}
/* 406mm printable content */
.c-no{width:5mm}.c-name{width:24mm}.c-job{width:12mm}.c-role{width:7mm}.c-sp{width:5mm}.c-hire{width:25mm}.c-birth{width:25mm}.c-address{width:66mm}.c-check{width:23mm}.c-blood{width:7mm}.c-special{width:27mm}.c-ins{width:39mm}.c-edu{width:29mm}.c-skill{width:27mm}.c-license{width:28mm}.c-entry{width:29mm}
@page{size:A3 landscape;margin:0}@media print{html,body{background:#fff}.toolbar{display:none}.sheet{width:420mm;height:297mm;margin:0;padding:8mm 7mm 7mm;box-shadow:none;break-after:page}.sheet:last-child{break-after:auto}}
</style></head><body>
<div class="toolbar"><b>作業員名簿｜A3横・提出様式</b><button class="back" onclick="location.href='sagyoin_master.html'">作業員マスターへ戻る</button><button class="print" onclick="window.print()">印刷／PDF保存</button></div><div id="pages"></div>
<script src="shared_storage.js"></script><script src="ms_data.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return'';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}年 ${Number(m[2])}月 ${Number(m[3])}日`:esc(v)};
const short=v=>{if(!v)return'';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${String(m[1]).slice(-2)}年 ${Number(m[2])}月 ${Number(m[3])}日`:esc(v)};
const age=v=>{if(!v)return'';const b=new Date(v+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a>=0?a+'歳':''};
const nl=s=>esc(s||'').replace(/\n/g,'<br>');
let c=null;try{c=JSON.parse(sessionStorage.getItem('ms_worker_print_company')||'null')}catch(e){}if(!c){$('pages').innerHTML='<section class="sheet">印刷する所属会社が選択されていません。</section>';return}
const workers=(MSData.all('workers')||[]).filter(w=>w.status!=='inactive'&&((w.companyId||'')===c.id||(!w.companyId&&w.companyName===c.name))).sort((a,b)=>(a.no||'').localeCompare(b.no||'','ja'));
let own='';try{const cs=MSData.all('companySettings')||[];own=(cs.find(x=>x.status!=='inactive')||cs[0]||{}).companyName||''}catch(e){}
const per=15,pages=[];for(let i=0;i<workers.length;i+=per)pages.push(workers.slice(i,i+per));if(!pages.length)pages.push([]);
function quals(w,t){const a=Array.isArray(w.qualifications)?w.qualifications.filter(x=>x.type===t):[];if(a.length)return a.map(x=>[x.name,x.date?short(x.date):'',x.no].filter(Boolean).join(' ')).map(esc).join('<br>');return nl(t==='特別教育'?w.specialEducation:t==='技能講習'?w.skillTraining:w.licenses)}
function header(pi,total){const now=new Date(),d=`（ ${now.getFullYear()}年　${now.getMonth()+1}月　${now.getDate()}日作成 ）`;return `<h1 class="title">作　業　員　名　簿</h1><div class="dateLine">${d}</div><div class="headArea"><div class="headLeft"><div class="line"><b>事業所の名称</b><span class="fill"></span></div><div class="line"><b>所　長　名</b><span class="fill"></span><span>殿</span></div></div><div class="companyBox"><div class="ji">（１次）</div><div class="company"><span>会社名</span><span class="fill">${esc(c.name||'')}</span></div></div><div class="confirmWrap"><div class="confirm"><div>元 請<br>確認欄</div><div></div></div><div class="pageNo">${pi+1} / ${total}</div></div></div>`}
function thead(){return `<thead><tr><th class="c-no">番<br>号</th><th class="c-name">フリガナ<br><span style="font-size:8pt">氏　名</span></th><th class="c-job">職種</th><th class="c-role">職<br>務<br>他</th><th class="c-sp">特<br>労</th><th class="c-hire">雇入年月日<br><span class="small">経験年数</span></th><th class="c-birth">生年月日<br><span class="small">年　齢</span></th><th class="c-address">現　住　所　（TEL）<br><span class="small">家　族　連　絡　（TEL）</span></th><th class="c-check">最近の健康診断日<br><span class="small">血　圧</span></th><th class="c-blood">血<br>液<br>型</th><th class="c-special">特殊健康診断日<br><span class="small">種　類</span></th><th class="c-ins">健　康　保　険<br>年　金　保　険<br>雇　用　保　険</th><th class="c-edu">教　育<br><span class="small">雇入・職長<br>特別教育</span></th><th class="c-skill">資　格<br><span class="small">技能講習</span></th><th class="c-license">免　許</th><th class="c-entry">新規入場時教育<br>実施年月日</th></tr></thead>`}
function person(w,no){const role=[w.roleMark,w.specialLabor].filter(Boolean);const ins1=[w.healthInsurance,w.healthInsuranceNo].filter(Boolean).join('　'),ins2=[w.pensionInsurance,w.pensionInsuranceNo].filter(Boolean).join('　'),ins3=[w.employmentInsurance,w.employmentInsuranceNo].filter(Boolean).join('　');return `<tr class="personStart"><td class="num" rowspan="3">${no}</td><td class="name" rowspan="3"><span class="kana">${esc(w.kana||'')}</span>${esc(w.name||'')}</td><td class="center" rowspan="3">${esc(w.occupation||'')}</td><td class="center" rowspan="3">${esc(w.roleMark||'')}</td><td class="center" rowspan="3">${esc(w.specialLabor||'')}</td><td class="date">${short(w.companyHireDate)}</td><td class="date">${short(w.birthDate)}</td><td>${esc(w.address||'')}${w.tel?`　${esc(w.tel)}`:''}</td><td class="date">${short(w.healthCheckDate)}</td><td class="blood" rowspan="3">${esc(w.bloodType||'')}</td><td class="date">${short(w.specialHealthDate)}</td><td class="center">${esc(ins1)}</td><td rowspan="3" class="tiny">${quals(w,'特別教育')}</td><td rowspan="3" class="tiny">${quals(w,'技能講習')}</td><td rowspan="3" class="tiny">${quals(w,'免許・資格')}</td><td rowspan="3" class="date">${short(w.acceptEducationDate||w.entryDate)}</td></tr><tr><td class="center subline">${w.experienceYears?esc(w.experienceYears)+' 年':''}</td><td class="center subline">${age(w.birthDate)}</td><td class="subline">${esc(w.familyAddress||'')}${w.familyTel?`　${esc(w.familyTel)}`:''}</td><td class="center subline">${esc(w.bloodPressure||'')}</td><td class="center subline">${w.specialHealthType?esc(w.specialHealthType):''}</td><td class="center subline">${esc(ins2)}</td></tr><tr><td class="center subline"><span class="tiny">${w.skillWorkerId?'技能者ID '+esc(w.skillWorkerId):''}</span></td><td class="center subline"></td><td class="subline"><span class="tiny">${w.familyName?'家族 '+esc(w.familyName):''}${w.familyRelation?'（'+esc(w.familyRelation)+'）':''}</span></td><td class="center subline"></td><td class="center subline"></td><td class="center subline">${esc(ins3)}${w.kentaikyo||w.chutaikyo?`<br><span class="tiny">${w.kentaikyo?'建退共 '+esc(w.kentaikyo):''}${w.chutaikyo?'　中退共 '+esc(w.chutaikyo):''}</span>`:''}</td></tr>`}
function table(rows,offset){let h=`<table class="roster">${thead()}<tbody>`;for(let i=0;i<per;i++){if(rows[i])h+=person(rows[i],offset+i+1);else h+=`<tr class="personStart blankrow"><td class="num">${offset+i+1}</td><td colspan="15"></td></tr>`}return h+'</tbody></table>'}
$('pages').innerHTML=pages.map((rows,i)=>`<section class="sheet">${header(i,pages.length)}${table(rows,i*per)}<div class="foot">A3横　1人3行</div></section>`).join('');})();
</script></body></html>
